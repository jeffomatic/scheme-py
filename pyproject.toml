[project]
name = "scheme-py"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright] # for pylance
extraPaths = ["src"]

[tool.ruff.lint]
# allow unused comment directives
unfixable = ["RUF100"]